<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hackerman Home</title>
  <style>
    body {
      background-color: black;
      color: darkgreen;
      font-family: monospace;
      margin: 0;
      padding: 20px;
    }

    nav {
      margin-bottom: 20px;
    }

    nav a {
      margin-right: 15px;
      color: darkgreen;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    #typewriter::after {
      content: '▊';
      margin-left: 5px;
      animation: blink 0.8s steps(1) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="cv.html">CV</a>
    <a href="blog.html">Blog</a>
  </nav>

  <header>
    <h1 id="typewriter"></h1>
  </header>

  <section>
    <p>Stay tuned for my latest projects and blog posts!</p>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const text = "Disassemble reality, one instruction at a time.";
      const typewriter = document.getElementById("typewriter");
      let index = 0;

      function type() {
        if (index < text.length) {
          typewriter.textContent += text.charAt(index);
          index++;
          setTimeout(type, 100);
        } else {
          setTimeout(reset, 2000);
        }
      }

      function reset() {
        typewriter.textContent = "";
        index = 0;
        setTimeout(type, 500);
      }

      type();
    });
  </script>
</body>
</html>
