<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        /* --- Configuration (Dark Green Theme) --- */
        :root {
            --background-color: #000000; /* Black */
            --text-color: #008000;       /* Dark Green */
            --prompt-color: #00aa00;     /* Slightly Brighter Green for prompt */
            --command-color: #cccccc;   /* Light Grey for typed commands */
            --output-color: #008000;    /* Dark Green for standard output */
            --title-color: #00bb00;      /* Brighter Green for titles */
            --link-color: #33cc33;       /* Lighter Green for links */
            --error-color: #cc6666;      /* Muted Red for errors */
            --font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-size: 1em;
        }

        /* --- Base Styles --- */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color); /* Default text color */
            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: 1.5;
        }

        /* --- Terminal Container --- */
        #terminal {
            height: 100vh;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* --- Output Area --- */
        #output {
            flex-grow: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--output-color); /* Use specific output color */
        }

        /* --- Input Line --- */
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .prompt {
            color: var(--prompt-color);
            font-weight: bold;
            margin-right: 8px;
        }

        #commandInput {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--command-color);
            font-family: inherit;
            font-size: inherit;
            outline: none;
            padding: 0;
            line-height: inherit;
        }

        /* --- Cursor --- */
        .cursor {
            display: inline-block;
            background-color: var(--text-color); /* Cursor color matches text */
            width: 10px;
            height: 1.2em;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
        }

        @keyframes blink {
            from, to { background-color: transparent; }
            50% { background-color: var(--text-color); } /* Blink with text color */
        }

        /* --- Specific Output Styles --- */
         .output-command {
             color: var(--command-color); /* Show command in command color */
         }
         .output-command .prompt { /* Style prompt within output */
             color: var(--prompt-color);
             font-weight: bold;
             margin-right: 8px;
         }

        .output-error {
            color: var(--error-color);
        }

        .output-title {
            color: var(--title-color); /* Use title color */
            font-weight: bold;
            /* text-decoration: underline; */ /* Optional: remove underline if preferred */
            margin-top: 10px;
            margin-bottom: 5px;
        }
         .output-title-icon { /* Style for icons in titles */
              margin-right: 8px;
         }

        .output-link {
            color: var(--link-color);
            text-decoration: underline;
            cursor: pointer;
        }
        .output-link:hover {
            color: var(--title-color); /* Brighten link on hover */
        }

         /* Style for subheadings within sections */
         .output-subtitle {
              color: var(--prompt-color); /* Use prompt color for subheadings */
              font-weight: bold;
              margin-top: 8px;
              margin-bottom: 3px;
              margin-left: 1em; /* Indent subheadings slightly */
         }

         /* Style list items */
         .output-list-item {
             margin-left: 2em; /* Indent list items */
         }
         .output-list-item-bullet {
              margin-right: 5px;
         }

        /* --- Helper class for typewriter effect --- */
        .typing {
             /* No specific style needed here currently */
        }

    </style>
</head>
<body>

<div id="terminal">
    <div id="output"></div>
    <div class="input-line">
        <span class="prompt">$&gt;</span> <input type="text" id="commandInput" autofocus autocomplete="off" spellcheck="false">
        <span class="cursor"></span>
    </div>
</div>

<script>
    const outputElement = document.getElementById('output');
    const commandInputElement = document.getElementById('commandInput');
    const terminalElement = document.getElementById('terminal');

    // --- Configuration ---
    const TYPE_DELAY = 50; // Milliseconds between character typing (adjust for speed)
    const BANNER_TEXT = "Disassemble reality, one instruction at a time.";
    const STARTUP_MESSAGES = [
        `tr3sp4ss3r`,
        "",
        `Type 'help' for commands or 'banner' to see the quote.`
    ];

    // --- CV Data (Integrated from your cv.html) ---
    const cvData = {
        name: "Daniel Mohagheghifard",
        contact: {
            email: "danielmmfard@gmail.com",
            github: "tr3sp4ss3rexe",
            linkedin: "danielthedaniel", // Just the username part for consistency
            linkedin_url: "https://www.linkedin.com/in/danielthedaniel/" // Full URL for link
        },
        skills: {
            programming: [
                 "C/C++",
                 "Python",
                 "NodeJS",
                 "x86_64 Assembly",

             ],
            security: {
                "Red Teaming & Penetration Testing": [
                    "Windows implant dev & AV evasion",
                    "Post-exploitation in AD environments: domain enum, SQL server attacks, priv esc, persistence, lateral movement",
                    "Operating from C2 infrastructure",
                    "Manual vuln & misconfig analysis",
                    "Experience with external pentests"
                ],
                "Web App Security": [
                    "SQLi, XSS, File Inclusion, Command Injection"
                ],
                "Vuln Research & Exploit Dev": [
                    "Familiarity with Stack/SEH/Heap overflows, info leaks",
                    "Bypass techniques: DEP, ASLR, stack cookies",
                    "Binary reversing & decompilation"
                ]
            },
            languages: [
                "Persian (native)",
                "English (professional)",
                "Swedish (professional)"
            ]
        },
        experience: [ // Employment section
            {
                title: "Software Engineering Intern",
                company: "Ericsson AB",
                period: "2025 – present",
                description: []
            },
            {
                title: "Developer, Security Researcher",
                company: "Ocleon AB",
                period: "2021 – 2022",
                description: []
            },
             {
                title: "Production Team Member",
                company: "Dynamic Code AB",
                period: "2020 – 2021",
                description: []
            }
        ],
        education: [
             {
                degree: "BSc in Software Engineering",
                institution: "BTH (Blekinge Tekniska Högskola)",
                period: "2023 – 2026",
                details: ""
            },
            {
                degree: "Information Technology",
                institution: "MTU Gymnasium",
                period: "2020 – 2023",
                details: ""
            }
        ],
        certifications: [ // Training & Certifications
            "✔️ CRTP - Altered Security",
            "✔️ CEH / CEH Practical - EC-Council (likely expired)",
            "✔️ Intermediate Malware Dev - Sektor7",
            "✔️ Offensive Driver Dev - Zero Point Security",
            "🛠️ CETP - Altered Security (in progress)",
            "🛠️ EXP-301 - Offensive Security (in progress)"
        ]
    };

    // --- Command History ---
    let commandHistory = [];
    let historyIndex = -1;

    // --- Core Functions ---

    // Appends text to the output, handling arrays, styling, and optional typing effect (Corrected Version)
    function appendOutput(text, className = '', typeEffect = false, callback = null) {
        const lines = Array.isArray(text) ? text : [text];

        if (!typeEffect) {
            // --- Simple Path for Instant Output ---
            lines.forEach(line => {
                const lineElement = document.createElement('div');
                if (className) lineElement.className = className;
                if (line.trim().startsWith('<')) {
                    lineElement.innerHTML = line;
                } else {
                    lineElement.textContent = line;
                }
                outputElement.appendChild(lineElement);
            });
            scrollToBottom();
            commandInputElement.focus();
            if (callback) callback();

        } else {
            // --- Original Typing Effect Path ---
            let charIndex = 0;
            let lineIndex = 0;
            let currentLineElement = null;

            function typeCharacter() {
                if (lineIndex >= lines.length) {
                    scrollToBottom();
                    commandInputElement.focus();
                    if (callback) callback();
                    return;
                }

                if (charIndex === 0) {
                    currentLineElement = document.createElement('div');
                    if (className) currentLineElement.className = className;
                    if (lines[lineIndex].trim().startsWith('<')) {
                        currentLineElement.innerHTML = lines[lineIndex];
                        outputElement.appendChild(currentLineElement);
                        lineIndex++;
                        charIndex = 0;
                        scrollToBottom();
                        setTimeout(typeCharacter, 5);
                        return;
                    } else {
                        outputElement.appendChild(currentLineElement);
                    }
                }

                const currentTextLine = lines[lineIndex];
                if (currentLineElement && charIndex < currentTextLine.length) {
                    currentLineElement.textContent += currentTextLine[charIndex];
                    charIndex++;
                    scrollToBottom();
                    setTimeout(typeCharacter, TYPE_DELAY);
                } else if (currentLineElement) {
                    lineIndex++;
                    charIndex = 0;
                    if (lineIndex < lines.length) {
                        setTimeout(typeCharacter, TYPE_DELAY * 2);
                    } else {
                        typeCharacter();
                    }
                }
            }
            typeCharacter();
        }
    }

    async function getBlogList() {
    return ["windows_internals"]; // Add more filenames as needed
    }

    // Formats CV sections for terminal output
    function formatSection(title, content, icon = '') {
        let output = [`<div class="output-title">${icon ? '<span class="output-title-icon">' + icon + '</span>' : ''}${title}</div>`];
        if (Array.isArray(content)) {
            content.forEach(item => {
                if (typeof item === 'object' && item !== null) {
                    // Handle Experience/Education format
                    if (item.title && item.company && item.period) { // Experience
                        output.push(`<div class="output-list-item"><span class="output-list-item-bullet">💼</span> ${item.title} @ ${item.company} (${item.period})</div>`);
                        if(item.description && item.description.length > 0){
                             item.description.forEach(desc => output.push(`<div class="output-list-item" style="margin-left: 3.5em;">- ${desc}</div>`));
                        }
                    } else if (item.degree && item.institution && item.period) { // Education
                        output.push(`<div class="output-list-item"><span class="output-list-item-bullet">🎓</span> ${item.degree} - ${item.institution} (${item.period})</div>`);
                        if (item.details) output.push(`<div class="output-list-item" style="margin-left: 3.5em;">- ${item.details}</div>`);
                    } else {
                        output.push(`<div class="output-list-item">${JSON.stringify(item)}</div>`);
                    }
                } else {
                    const bullet = item.includes('✔️') ? '' : (item.includes('🛠️') ? '' : '-');
                    output.push(`<div class="output-list-item">${bullet ? '<span class="output-list-item-bullet">'+bullet+'</span> ' : ''}${item}</div>`);
                }
            });
        } else if (typeof content === 'object' && content !== null) {
             for (const key in content) {
                 if (content.hasOwnProperty(key)) {
                     const value = content[key];
                     if(typeof value === 'object' && !Array.isArray(value)){ // Nested object like skills.security
                          output.push(`<div class="output-subtitle">${key}</div>`);
                          for (const subKey in value) {
                              if (value.hasOwnProperty(subKey)) {
                                  if(Array.isArray(value[subKey])){
                                       value[subKey].forEach(skillItem => output.push(`<div class="output-list-item"><span class="output-list-item-bullet">-</span> ${skillItem}</div>`));
                                  } else {
                                       output.push(`<div class="output-list-item">${subKey}: ${value[subKey]}</div>`);
                                  }
                              }
                          }
                     } else if (Array.isArray(value)) { // Simple list within the object (like skills.programming)
                          output.push(`<div class="output-subtitle">${key.charAt(0).toUpperCase() + key.slice(1)}</div>`);
                           value.forEach(item => output.push(`<div class="output-list-item"><span class="output-list-item-bullet">-</span> ${item}</div>`));
                     }
                     else if (value) {
                         let displayValue = value;
                         if (key === 'email') {
                             displayValue = `<a href="mailto:${value}" class="output-link">${value}</a>`;
                         } else if (key === 'github') {
                             displayValue = `<a href="https://github.com/${value}" target="_blank" class="output-link">github.com/${value}</a>`;
                         } else if (key === 'linkedin_url') {
                              continue;
                         } else if (key === 'linkedin'){
                             const url = cvData.contact.linkedin_url || `https://www.linkedin.com/in/${value}/`;
                             displayValue = `<a href="${url}" target="_blank" class="output-link">linkedin.com/in/${value}</a>`;
                         }
                         output.push(`<div class="output-list-item"><span style="text-transform: capitalize;">${key.replace('_url','')}</span>: ${displayValue}</div>`);
                     }
                 }
            }
        } else {
            output.push(content);
        }
        output.push('');
        return output;
    }

    // Processes the entered command
    function processCommand(command) {
         const commandTrimmed = command.trim();
         const commandOutputLine = document.createElement('div');
         commandOutputLine.classList.add('output-command');
         commandOutputLine.innerHTML = `<span class="prompt">$&gt;</span>${commandTrimmed}`;
         outputElement.appendChild(commandOutputLine);

        if (commandTrimmed && commandTrimmed !== commandHistory[commandHistory.length - 1]) {
            commandHistory.push(commandTrimmed);
        }
        historyIndex = commandHistory.length;

        const args = commandTrimmed.toLowerCase().split(' ').filter(arg => arg !== '');
        const cmd = args[0];

        // Add small delay before showing output for realism
        setTimeout(() => {
             switch (cmd) {
                 case 'help':
                     // ** UPDATED Help Message **
                     appendOutput([
                         "Command List:",
                         "  help          - Shows this help message",
                         "  whoami        - Displays the full CV",
                         "  contact       - Shows contact details",
                         "  banner        - Displays the startup banner quote",
                         "  clear         - Clears the terminal screen",
                         "  echo [text]   - Prints the text back",
                         "  blog          - Info about the blog",
                         "",
                         "Tip: Use Up/Down arrow keys for command history."
                     ]);
                     break;

                 case 'whoami':
                      appendOutput([
                          `Displaying full CV for ${cvData.name}:`,
                          ""
                           ]);
                      // Display all sections sequentially
                      appendOutput(formatSection("Contact", cvData.contact, '✉️'));
                      appendOutput(formatSection("Skills", cvData.skills, '🧠'));
                      appendOutput(formatSection("Experience", cvData.experience, '💼'));
                      appendOutput(formatSection("Education", cvData.education, '🎓'));
                      appendOutput(formatSection("Certifications", cvData.certifications, '📜'));
                      appendOutput(formatSection("Languages", cvData.skills.languages, '🌐'));
                      break;

                 case 'contact': // Kept contact as it's often useful standalone
                     appendOutput(formatSection("Contact Information", cvData.contact, '✉️'));
                     break;

                 // ** REMOVED Cases for: whoami, skills, experience, education, certs, languages **

                 case 'banner':
                     appendOutput(BANNER_TEXT, '', true); // Typewriter effect for banner
                     break;

                 // ** REMOVED Case for: motd **

                case 'blog':
                    if (args.length === 1) {
                        // List all blogs
                        try {
                            const blogList = await getBlogList();
                            if (blogList.length > 0) {
                                appendOutput(["Available Blogs:"].concat(blogList.map(blog => `<a href="blogs/${blog}.html" class="output-link">${blog}</a>`)));
                            } else {
                                appendOutput("No blogs available yet.");
                            }
                        } catch (error) {
                            appendOutput(`Error fetching blog list: ${error}`, 'output-error');
                        }
                    } else {
                        // View a specific blog
                        const blogName = args.slice(1).join('_'); // Handle spaces in blog names
                        window.location.href = `blogs/${blogName}.html`; // Redirect to the blog page
                    }
                    break;

                 case 'clear':
                     outputElement.innerHTML = '';
                     break;

                 case 'echo':
                     const textToEcho = args.slice(1).join(' ');
                     appendOutput(textToEcho || '');
                     break;

                 // ** REMOVED Case for: date **

                 default:
                     if (commandTrimmed) {
                         appendOutput(`command not found: ${commandTrimmed}`, 'output-error');
                     } else {
                         appendOutput('');
                     }
             }
              setTimeout(() => {
                  scrollToBottom();
                  commandInputElement.focus();
              }, 50);

        }, 10);
    }

    // Scrolls the terminal to the bottom
    function scrollToBottom() {
        setTimeout(() => {
           terminalElement.scrollTop = terminalElement.scrollHeight;
        }, 0);
    }

    // --- Event Listeners ---
    commandInputElement.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            const command = commandInputElement.value;
            commandInputElement.value = '';
            processCommand(command);
        } else if (event.key === 'ArrowUp') {
             event.preventDefault();
            if (commandHistory.length > 0 && historyIndex > 0) {
                historyIndex--;
                commandInputElement.value = commandHistory[historyIndex];
                setTimeout(() => commandInputElement.setSelectionRange(commandInputElement.value.length, commandInputElement.value.length), 0);
            }
        } else if (event.key === 'ArrowDown') {
             event.preventDefault();
            if (historyIndex < commandHistory.length - 1) {
                historyIndex++;
                commandInputElement.value = commandHistory[historyIndex];
                 setTimeout(() => commandInputElement.setSelectionRange(commandInputElement.value.length, commandInputElement.value.length), 0);
            } else if (historyIndex === commandHistory.length - 1) {
                 historyIndex = commandHistory.length;
                 commandInputElement.value = '';
            }
        }
    });

    terminalElement.addEventListener('click', function(event) {
         if (event.target.tagName !== 'A' && window.getSelection().toString() === '') {
            commandInputElement.focus();
         }
    });

    // --- Initialization ---
    function initializeTerminal() {
         STARTUP_MESSAGES.forEach(msg => appendOutput(msg)); // Show startup instantly
         appendOutput(BANNER_TEXT,'', true, () => { // Type out the banner
            scrollToBottom();
            commandInputElement.focus();
         });
    }

    // Start the terminal
    initializeTerminal();

</script>
